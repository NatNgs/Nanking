<!DOCTYPE html>
<html lang="en">
<head>
	<title>Nanking</title>
	<meta charset="UTF-8"/>
	<link rel="stylesheet" href="https://ajax.googleapis.com/ajax/libs/jqueryui/1.14.0/themes/smoothness/jquery-ui.css">
	<link rel="stylesheet" href="styles/main.css">

	<!-- External -->
	<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
	<script src="https://ajax.googleapis.com/ajax/libs/jqueryui/1.14.0/jquery-ui.min.js"></script>
	<script src="https://cdn.jsdelivr.net/gh/Caligatio/jsSHA@3.3.2/dist/sha.js"></script>

	<!-- Internal -->
	<script src="home.js"></script>
</head>

<!-- ########## BODY ########## -->

<body onload="init()">
	<form id="form_login">
		<h2>Login</h2>
		<p>Login: <input type="text" id="login" name="nankingLogin" pattern="^[a-zA-Z0-9_\-]{4,12}$"></p>
		<p>Password: <input type="password" id="password" name="nankingPwd" pattern="^.{6,}$"></p>
		<button type="submit">Login</button>
	</form>
	<hr/>
	<form id="form_register">
		<h2>Register</h2>
		<p>Login: <input type="text" id="new_login" name="nankingLogin"></p>
		<p>Password: <input type="password" id="new_password" name="nankingPwd" pattern=".{6,}"></p>
		<button type="submit">Register</button>
	</form>
</body>

</html>
